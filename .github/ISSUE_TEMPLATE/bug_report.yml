name: 🐛 Bug Report
description: Report an issue or unexpected calculation behavior in Vitralis
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Vitralis! Please provide as much detail as possible.

  - type: input
    id: summary
    attributes:
      label: Bug Summary
      description: A concise description of the bug.
      placeholder: e.g. Solder cost calculation does not update when ratio changes to 50/50
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the behavior.
      value: |
        1. Go to '...'
        2. Enter value '...'
        3. Click on '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected vs Actual Behavior
      description: What did you expect to happen, and what actually happened?
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Platform & Environment
      options:
        - Desktop Chrome / Edge
        - Desktop Safari / macOS
        - Desktop Firefox
        - Mobile iOS (Safari / PWA)
        - Mobile Android (Chrome / PWA)
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context / Screenshots
      description: Attach screenshots, browser console logs, or project JSON export.
