<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </radialGradient>
    
    <!-- Glass Facet Gradients -->
    <linearGradient id="amberGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.85" />
    </linearGradient>
    
    <linearGradient id="rubyGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#9f1239" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="sapphireGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="emeraldGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="amethystGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#7e22ce" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="cobaltGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#4338ca" stop-opacity="0.85" />
    </linearGradient>
    
    <!-- Lead Came / Solder Line Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#6366f1" stroke-width="2" stroke-opacity="0.3" />

  <!-- Outer Glass Frame Ring (Lead Came Border) -->
  <g transform="translate(256,256) scale(0.92) translate(-256,-256)">
    <!-- Central Stained Glass Rosette Facets -->
    <!-- Top Apex Piece -->
    <polygon points="256,64 350,150 256,210 162,150" fill="url(#rubyGlass)" />
    <!-- Top-Right Piece -->
    <polygon points="350,150 448,256 350,290 256,210" fill="url(#amberGlass)" />
    <!-- Bottom-Right Piece -->
    <polygon points="350,290 448,256 380,390 256,330" fill="url(#amethystGlass)" />
    <!-- Bottom Apex Piece -->
    <polygon points="256,330 380,390 256,448 132,390" fill="url(#cobaltGlass)" />
    <!-- Bottom-Left Piece -->
    <polygon points="256,330 132,390 64,256 162,290" fill="url(#sapphireGlass)" />
    <!-- Top-Left Piece -->
    <polygon points="162,290 64,256 162,150 256,210" fill="url(#emeraldGlass)" />

    <!-- Center Jewel (Diamond Centerpiece) -->
    <polygon points="256,210 350,290 256,330 162,290" fill="#ffffff" fill-opacity="0.85" filter="url(#glow)" />
    <polygon points="256,225 330,285 256,315 182,285" fill="url(#amberGlass)" />

    <!-- Lead Solder Lines (Came & Copper Foil) -->
    <g stroke="#111827" stroke-width="10" stroke-linejoin="round" stroke-linecap="round">
      <!-- Outer perimeter -->
      <polygon points="256,64 448,256 380,390 256,448 132,390 64,256" fill="none" stroke-width="14" stroke="#1f2937" />
      
      <!-- Inner radial lines -->
      <line x1="256" y1="64" x2="256" y2="210" />
      <line x1="162" y1="150" x2="256" y2="210" />
      <line x1="350" y1="150" x2="256" y2="210" />
      <line x1="64" y1="256" x2="162" y2="290" />
      <line x1="448" y1="256" x2="350" y2="290" />
      <line x1="132" y1="390" x2="256" y2="330" />
      <line x1="380" y1="390" x2="256" y2="330" />
      <line x1="256" y1="448" x2="256" y2="330" />

      <!-- Center diamond boundary -->
      <polygon points="256,210 350,290 256,330 162,290" fill="none" stroke-width="12" stroke="#0f172a" />
    </g>

    <!-- Soldering Highlights (Shimmer on joints) -->
    <g fill="#e2e8f0" opacity="0.8">
      <circle cx="256" cy="210" r="5" />
      <circle cx="350" cy="290" r="5" />
      <circle cx="256" cy="330" r="5" />
      <circle cx="162" cy="290" r="5" />
      <circle cx="256" cy="64" r="6" />
      <circle cx="448" cy="256" r="6" />
      <circle cx="256" cy="448" r="6" />
      <circle cx="64" cy="256" r="6" />
    </g>
  </g>
</svg>